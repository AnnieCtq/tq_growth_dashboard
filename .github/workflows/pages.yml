name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scrub check
        env:
          SCRUB_TERMS: ${{ secrets.SCRUB_TERMS }}
        run: |
          if [ -z "$SCRUB_TERMS" ]; then
            echo "::warning::SCRUB_TERMS secret not set, so the scrub check was skipped. Add it in Settings → Secrets → Actions."
          else
            python3 scripts/scrub_check.py --all
          fi

  build:
    needs: scrub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
